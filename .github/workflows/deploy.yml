name: Test and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify application
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Test
        run: npx vitest run --pool=forks --maxWorkers=1

  deploy:
    name: Deploy to Ubuntu
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Install SSH credentials
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          test -n "$DEPLOY_KEY" || { echo 'DEPLOY_SSH_KEY is missing'; exit 1; }
          test -n "$DEPLOY_KNOWN_HOSTS" || { echo 'DEPLOY_KNOWN_HOSTS is missing'; exit 1; }
          umask 077
          printf '%s\n' "$DEPLOY_KEY" > "$RUNNER_TEMP/madinaty_deploy_key"
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
      - name: Pull and restart production
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          test -n "$DEPLOY_HOST" || { echo 'DEPLOY_HOST is missing'; exit 1; }
          test -n "$DEPLOY_USER" || { echo 'DEPLOY_USER is missing'; exit 1; }
          test -n "$DEPLOY_PATH" || { echo 'DEPLOY_PATH is missing'; exit 1; }
          ssh -i "$RUNNER_TEMP/madinaty_deploy_key" -p "${DEPLOY_PORT:-22}" "$DEPLOY_USER@$DEPLOY_HOST" "cd '$DEPLOY_PATH' && git fetch origin main && git checkout main && git pull --ff-only origin main && docker compose --env-file .env config >/dev/null && docker compose --env-file .env up -d --build --remove-orphans --wait && docker compose --env-file .env exec -T app node -e \"fetch('http://127.0.0.1:3000/api/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""
