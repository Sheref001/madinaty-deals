services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-madinaty_deals}
      POSTGRES_USER: ${POSTGRES_USER:-madinaty}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the server .env file}
    volumes:
      - madinaty-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-madinaty}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-madinaty_deals}
      PORT: 3000
      APP_ENV: ${APP_ENV:-production}
      APP_ORIGIN: ${APP_ORIGIN:?Set APP_ORIGIN in the server .env file}
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in the server .env file}
      MAIL_PROVIDER: ${MAIL_PROVIDER:-smtp}
      REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-false}
      COGNITO_ENABLED: ${COGNITO_ENABLED:-false}
      COGNITO_ISSUER_URL: ${COGNITO_ISSUER_URL:-}
      COGNITO_CLIENT_ID: ${COGNITO_CLIENT_ID:-}
      COGNITO_CLIENT_SECRET: ${COGNITO_CLIENT_SECRET:-}
      COGNITO_CALLBACK_URL: ${COGNITO_CALLBACK_URL:-}
      COGNITO_DOMAIN_URL: ${COGNITO_DOMAIN_URL:-}
      TRANSLATION_ENABLED: ${TRANSLATION_ENABLED:-false}
      TRANSLATION_REGION: ${TRANSLATION_REGION:-eu-north-1}
      AWS_REGION: ${AWS_REGION:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-hello@madinatydeals.com}
      MS_TENANT_ID: ${MS_TENANT_ID:-}
      MS_CLIENT_ID: ${MS_CLIENT_ID:-}
      MS_TOKEN_FILE: ${MS_TOKEN_FILE:-/app/data/mail-auth/token.json}
      UPLOAD_DIRECTORY: /app/data/uploads
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      RUN_SEED: ${RUN_SEED:-false}
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - madinaty-uploads:/app/data/uploads
      - madinaty-mail-auth:/app/data/mail-auth

volumes:
  madinaty-postgres:
  madinaty-uploads:
  madinaty-mail-auth:
